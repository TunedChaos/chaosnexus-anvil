[package]
name = "chaosnexus-anvil"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "chaosnexus_anvil"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.23.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.5", features = ["derive", "env"] }
directories = "6.0.0"
dotenvy = "0.15.7"
futures-util = "0.3.33"
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
notify = "8.2.0"
redis = { version = "1.5", features = ["tokio-comp"], optional = true }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
polars = { version = "0.54.4", features = ["lazy", "sql", "csv", "json"], optional = true }
rhai = { version = "1.25.1", features = ["serde", "sync", "metadata", "internals"] }
rsntp = { version = "4.1.2", features = ["chrono"] }
rust-mcp-axum = "1.0.1"
rust-mcp-sdk = "1.0.1"
rust-mcp-transport = "1.0.0"
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
skytable = { version = "0.8.12", optional = true }
sled = "0.34.7"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["v4"] }
rhai-ml = { path = "../vendor/rhai-ml", features = ["metadata"] }
rhai-bigint = "0.1.9"
rhai-sci = { version = "0.3.0", features = ["metadata"] }
rhai-rand = { version = "0.2.0", features = ["metadata"] }
bincode = "=1.3.3"
smartcore = "=0.3.0"

[features]
default = ["database", "files"]
database = ["dep:skytable", "dep:sea-orm", "dep:redis"]
files = ["dep:polars"]
